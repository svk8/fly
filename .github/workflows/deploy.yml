name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: flyparcel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PROFILE: ${{ vars.DEPLOY_PROFILE || 'shared' }}
      DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'delivery' }}
      DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
    steps:
      - name: Ignore obsolete CI results
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$DEPLOY_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Newer main commit exists; skip this deployment.'
          fi
      - uses: actions/checkout@v6
        if: steps.latest.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Install SSH transport
        if: steps.latest.outputs.deploy == 'true'
        run: npm install --prefix "$RUNNER_TEMP/deploy-client" --no-audit --no-fund ssh2@1.17.0
      - name: Deploy tested release and verify health
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NODE_PATH: ${{ runner.temp }}/deploy-client/node_modules
        run: |
          git archive --format=tar.gz --output=release.tar.gz "$DEPLOY_SHA"
          node .github/scripts/deploy_client.cjs
